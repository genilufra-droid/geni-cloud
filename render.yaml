# Render Blueprint — "Sistemi Genit Cloud" (Django)
# Deploy: shtyp "New +" → "Blueprint" në Render dhe lidh këtë repo GitHub.
# Render do të krijojë automatikisht PostgreSQL + Web Service sipas këtij skedari.

databases:
  - name: genit-cloud-db
    plan: free
    databaseName: genit_cloud
    user: genit_cloud

services:
  - type: web
    name: genit-cloud
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn genit_cloud.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: genit-cloud-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"